[workspace]
resolver = "2"
members = ["packages/project-meta", "packages/jschema-configs"]
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
anyhow = "1.0"
thiserror = "2.0"
confique = { version = "0.4", features = ["toml"] }
insta = { version = "1.41.1", features = ["yaml", "redactions"] }
typify = { path = "../typify/typify" }
schemars = "1.0.0"
syn = "2"
prettyplease = "0.3"
regress = "0.11"
cargo_toml = "1.0"
document-features = "0.2"
