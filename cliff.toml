# git-cliff configuration for confy
# https://git-cliff.org/docs/configuration
[changelog]
# Changelog header, rendered once at the top of the file.
header = """
<!-- generated by git-cliff, do not edit manually -->
# Changelog

All notable changes to this project are documented in this file, based on
[Conventional Commits](https://www.conventionalcommits.org/).

"""
# Template of one release section.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}\n
{% else %}\
    ## [Unreleased]\n
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
    ### {{ group | upper_first }}\n\
    {% for commit in commits %}\
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}⚠️ **breaking:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}])\n\
    {% endfor %}
{% endfor %}\n
"""
footer = """\n<!-- generated by git-cliff -->\n"""
# Remove leading and trailing whitespace from the changelog.
trim = true

[git]
# Only parse Conventional Commits; everything else lands in "Other".
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^revert", group = "Reverted" },
    { message = "^doc", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Style" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^Merge ", skip = true },
    { message = "^chore", group = "Miscellaneous Tasks" },
    { message = ".*", group = "Other" },
]
# Never drop a commit that is marked as breaking, even if its type is skipped.
protect_breaking_commits = true
filter_commits = false
# Only consider tags such as v1.2.3 for release sections.
tag_pattern = "v[0-9].*"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
