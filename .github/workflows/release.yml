name: Release

# Release flow:
#   1. Bump versions (cargo release) — commit chore(release) + push tag v*
#   2. This workflow generates the changelog with git-cliff, builds release
#      binaries for the three major platforms, publishes a GitHub release
#      with the artifacts and changelog, then publishes the crates to
#      crates.io (requires the CARGO_REGISTRY_TOKEN secret).

on:
  push:
    tags: ["v[0-9].*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    name: Generate changelog (git-cliff)
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Generate changelog for the current tag
        id: cliff
        run: |
          git-cliff --latest --strip header > release-notes.md
          cat release-notes.md
          {
            echo 'content<<EOF'
            cat release-notes.md
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: release-notes.md

  build:
    name: Build (${{ matrix.target }})
    needs: changelog
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} -p confy-cli
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          dir="confy-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/confy" "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $dir = "confy-$($env:GITHUB_REF_NAME)-${{ matrix.target }}"
          New-Item -ItemType Directory "$dir" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/confy.exe" "$dir/"
          Copy-Item README.md, LICENSE "$dir/"
          Compress-Archive -Path "$dir" -DestinationPath "$dir.zip"
          (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash | Set-Content "$dir.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            confy-${{ github.ref_name }}-${{ matrix.target }}.*
            !confy-${{ github.ref_name }}-${{ matrix.target }}/

  github-release:
    name: GitHub release
    needs: [changelog, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.changelog.outputs.content }}
          files: |
            artifacts/confy-*

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    environment: crates.io
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish confy-jschema-configs
        run: cargo publish -p confy-jschema-configs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish confy-project-meta
        run: cargo publish -p confy-project-meta
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish confy-cli
        run: cargo publish -p confy-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
